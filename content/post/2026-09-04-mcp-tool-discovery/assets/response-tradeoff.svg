<svg viewBox="0 0 580 420" width="580" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Patrick Hand', 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', cursive; }
  </style>

  <!-- Canvas -->
  <rect width="580" height="420" fill="#fffce8"/>

  <!-- Title -->
  <text x="290" y="30" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="middle">Response 陷阱: 三方权衡</text>

  <!-- Triangle edges -->
  <path d="M290,68 L 88,310 L 492,310 Z" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Vertex nodes -->
  <!-- Top: Token 效率 -->
  <rect x="218" y="48" width="144" height="39" rx="6"
        fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
  <text x="290" y="72" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">Token 效率</text>

  <!-- Bottom-left: 服务端复杂度 -->
  <rect x="18" y="298" width="150" height="39" rx="6"
        fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
  <text x="93" y="322" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">服务端复杂度</text>

  <!-- Bottom-right: 客户端易用性 -->
  <rect x="412" y="298" width="150" height="39" rx="6"
        fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
  <text x="487" y="322" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">客户端易用性</text>

  <!-- Edge labels -->
  <!-- Left edge: Token 效率 <-> 服务端复杂度 -->
  <text x="155" y="183" font-size="10" fill="#1e1e1e" text-anchor="middle" transform="rotate(-54,155,183)">要省 token</text>
  <text x="165" y="200" font-size="10" fill="#1e1e1e" text-anchor="middle" transform="rotate(-54,165,200)">就得拆精细接口</text>

  <!-- Right edge: Token 效率 <-> 客户端易用性 -->
  <text x="420" y="183" font-size="10" fill="#1e1e1e" text-anchor="middle" transform="rotate(54,420,183)">接口越精细</text>
  <text x="410" y="200" font-size="10" fill="#1e1e1e" text-anchor="middle" transform="rotate(54,410,200)">client 选择越难</text>

  <!-- Bottom edge: 服务端复杂度 <-> 客户端易用性 -->
  <text x="290" y="290" font-size="10" fill="#1e1e1e" text-anchor="middle">大而全的接口: 简单易用但 token 爆炸</text>

  <!-- Center label -->
  <rect x="195" y="195" width="190" height="50" rx="6"
        fill="#fff3bf" stroke="#1e1e1e" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="290" y="216" font-size="11" font-weight="700" fill="#1e1e1e" text-anchor="middle">MCP 协议内部</text>
  <text x="290" y="234" font-size="11" font-weight="700" fill="#1e1e1e" text-anchor="middle">无法同时满足三者</text>

  <!-- Bottom annotation -->
  <text x="290" y="365" font-size="11" fill="#1e1e1e" text-anchor="middle">拆精细接口 = 在 MCP server 层重新实现 GraphQL</text>
  <text x="290" y="383" font-size="11" fill="#1e1e1e" text-anchor="middle">精细化 tool 越多, LLM 选择越难 -> schema 膨胀恶性循环</text>
  <text x="290" y="405" font-size="11" font-weight="700" fill="#e03131" text-anchor="middle">本质是转移复杂度, 不是消除复杂度</text>
</svg>
