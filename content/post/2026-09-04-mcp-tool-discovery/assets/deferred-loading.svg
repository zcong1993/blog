<svg viewBox="0 0 750 400" width="750" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Patrick Hand', 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', cursive; }
  </style>
  <defs>
    <marker id="dl" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 z" fill="#1e1e1e"/>
    </marker>
    <marker id="dl-r" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 z" fill="#e03131"/>
    </marker>
    <marker id="dl-t" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 z" fill="#099268"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="750" height="400" fill="#fffce8"/>

  <!-- Title -->
  <text x="375" y="30" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="middle">Eager vs Deferred Loading: 顺序倒置</text>

  <!-- ===== Left: Eager (normal order) ===== -->
  <rect x="25" y="50" width="330" height="280" rx="8"
        fill="none" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="10,6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="35" y="65" font-size="11" fill="#1e1e1e">Eager Loading</text>

  <!-- Step 1 -->
  <rect x="50" y="80" width="280" height="39" rx="6"
        fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
  <text x="190" y="104" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">1. 读取全部 tool description</text>

  <path d="M190,124 L 190,138" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dl)"/>

  <!-- Step 2 -->
  <rect x="50" y="152" width="280" height="39" rx="6"
        fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
  <text x="190" y="176" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">2. 基于描述选择 tool</text>

  <path d="M190,196 L 190,210" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dl)"/>

  <!-- Step 3 -->
  <rect x="50" y="224" width="280" height="39" rx="6"
        fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
  <text x="190" y="248" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">3. 调用 tool</text>

  <!-- Verdict -->
  <text x="190" y="292" font-size="11" fill="#099268" text-anchor="middle" font-weight="700">信息完整, 选择准确</text>
  <text x="190" y="310" font-size="10" fill="#e03131" text-anchor="middle">但 schema 常驻上下文 (~60K tok)</text>

  <!-- ===== Right: Deferred (inverted order) ===== -->
  <rect x="395" y="50" width="330" height="280" rx="8"
        fill="none" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="10,6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="405" y="65" font-size="11" fill="#1e1e1e">Deferred Loading</text>

  <!-- Step 1 -->
  <rect x="420" y="80" width="280" height="39" rx="6"
        fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
  <text x="560" y="104" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">1. 只看 tool 名称列表</text>

  <path d="M560,124 L 560,138" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dl)"/>

  <!-- Step 2 -->
  <rect x="420" y="152" width="280" height="39" rx="6"
        fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
  <text x="560" y="176" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">2. 猜名字选择 tool</text>

  <path d="M560,196 L 560,210" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dl)"/>

  <!-- Step 3 -->
  <rect x="420" y="224" width="280" height="39" rx="6"
        fill="#fff3bf" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
  <text x="560" y="248" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">3. 再读 description + 调用</text>

  <!-- Verdict -->
  <text x="560" y="292" font-size="11" fill="#099268" text-anchor="middle" font-weight="700">节省了 schema 上下文</text>
  <text x="560" y="310" font-size="10" fill="#e03131" text-anchor="middle">但选择准确性下降 (顺序倒置)</text>

  <!-- ===== Bottom summary ===== -->
  <rect x="70" y="348" width="610" height="36" rx="6"
        fill="#ffc9c9" stroke="#1e1e1e" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="375" y="365" font-size="11" font-weight="700" fill="#1e1e1e" text-anchor="middle">Deferred Loading 只缓解了 Schema 陷阱</text>
  <text x="375" y="379" font-size="10" fill="#e03131" text-anchor="middle">Response 陷阱依然敞着: callTool 返回值该灌多少还是灌多少</text>
</svg>
